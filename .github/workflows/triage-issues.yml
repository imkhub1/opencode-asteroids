name: Triage new issues

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Classify and annotate issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`.toLowerCase();

            const typeRules = [
              {
                label: 'bug',
                terms: ['bug', 'error', 'fallo', 'falla', 'problema', 'crash', 'roto', 'no funciona', 'broken']
              },
              {
                label: 'feature',
                terms: ['feature', 'mejora', 'agregar', 'añadir', 'nuevo', 'solicitud', 'sugerencia', 'request']
              },
              {
                label: 'documentation',
                terms: ['documentación', 'documentacion', 'docs', 'readme', 'typo']
              },
              {
                label: 'question',
                terms: ['pregunta', 'duda', 'cómo', 'como', 'ayuda', 'question', '?']
              }
            ];

            const matches = (terms) => terms.reduce(
              (count, term) => count + (text.includes(term) ? 1 : 0),
              0
            );

            const detectedType = typeRules
              .map((rule, index) => ({ ...rule, score: matches(rule.terms), index }))
              .sort((a, b) => b.score - a.score || a.index - b.index)[0];
            const typeLabel = detectedType.score > 0 ? detectedType.label : 'question';

            const priorityLabel = /\b(urgent|urgente|critical|critico|crítico|bloquea|blocker|production|producción)\b/.test(text)
              ? 'priority:high'
              : /\b(low|baja|bajo|cosmetic|cosmético|cosmetico|minor|menor)\b/.test(text)
                ? 'priority:low'
                : 'priority:medium';

            const labelDefinitions = {
              bug: { color: 'D73A4A', description: 'Algo no funciona correctamente' },
              feature: { color: 'A2EEEF', description: 'Nueva funcionalidad o mejora' },
              documentation: { color: '0075CA', description: 'Cambios en documentación' },
              question: { color: 'D876E3', description: 'Pregunta o solicitud por aclarar' },
              'priority:high': { color: 'B60205', description: 'Prioridad alta' },
              'priority:medium': { color: 'FBCA04', description: 'Prioridad media' },
              'priority:low': { color: '0E8A16', description: 'Prioridad baja' }
            };

            for (const name of [typeLabel, priorityLabel]) {
              const definition = labelDefinitions[name];
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name,
                  color: definition.color,
                  description: definition.description
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const managedLabels = new Set([
              ...typeRules.map((rule) => rule.label),
              'priority:high',
              'priority:medium',
              'priority:low'
            ]);
            const existingLabels = issue.labels
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter((name) => name && !managedLabels.has(name));

            await github.rest.issues.setLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: [...existingLabels, typeLabel, priorityLabel]
            });

            const marker = '<!-- automated-issue-review -->';
            if ((issue.body || '').includes(marker)) return;

            const annotation = [
              '',
              '---',
              '## Información para revisión',
              '',
              `**Tipo detectado:** \`${typeLabel}\``,
              `**Prioridad sugerida:** \`${priorityLabel}\``,
              '',
              '### Checklist',
              '- [ ] Confirmar pasos para reproducir o validar la solicitud.',
              '- [ ] Verificar el comportamiento esperado y el comportamiento actual.',
              '- [ ] Definir el alcance y los criterios de aceptación.',
              '',
              marker
            ].join('\n');

            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              body: `${issue.body || ''}${annotation}`
            });
